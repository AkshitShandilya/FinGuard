site_name: FinGuard AI
site_description: Real-time financial fraud detection that explains every decision
site_author: Arnav Kathuria, Akshit Shandilya
site_url: https://akshitshandilya.github.io/FinGuard/
repo_url: https://github.com/AkshitShandilya/FinGuard
repo_name: AkshitShandilya/FinGuard
copyright: FinGuard AI. Department of Computer Engineering, TIET. Educational prototype.

theme:
  name: material
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Design:
      - Architecture: architecture.md
      - Machine learning: model.md
      - API reference: api.md
      - Diagrams: diagrams.md
  - Build:
      - Installation: installation.md
      - Prototype: prototype.md
      - Testing: testing.md
  - Reports: reports.md